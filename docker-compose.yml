services:
  nma-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpyd-nma
    working_dir: /analysis
    # Volume mount for local development (may not work in devcontainers):
    # volumes:
    #   - ./output:/analysis/output
    # After running: docker cp dpyd-nma:/analysis/output ./output
    command: ["Rscript", "R/run_analysis.R"]

  # Interactive R session for development/debugging
  r-interactive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpyd-nma-interactive
    working_dir: /analysis
    stdin_open: true
    tty: true
    command: ["R"]
