services:
  nma-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpyd-nma
    # Note: Files are copied into image during build (see Dockerfile)
    # Output is written to /analysis/output inside container
    # Use 'docker cp dpyd-nma:/analysis/output ./output' to extract results
    working_dir: /analysis
    command: ["Rscript", "R/run_analysis.R"]

  # Interactive R session for development/debugging
  r-interactive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpyd-nma-interactive
    working_dir: /analysis
    stdin_open: true
    tty: true
    command: ["R"]
